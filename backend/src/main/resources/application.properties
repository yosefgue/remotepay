spring.application.name=backend
clover.app-id=${CLOVER_APP_ID}
clover.app-secret=${CLOVER_APP_SECRET}
clover.redirect-uri=${CLOVER_REDIRECT_URI}
clover.base-authorize-url=${CLOVER_BASE_AUTHORIZE_URL}
clover.base-api-url=${CLOVER_BASE_API_URL}

# db config
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# flyway config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# jpa/hibernate config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# session/cookie config
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=7d

server.forward-headers-strategy=framework